# Shared configuration. Every value that differs between machines or is secret
# comes from an environment variable (or from a .env file, see README).
spring:
  application:
    name: trilane-api
  profiles:
    default: dev
  config:
    # Lets local development read KEY=VALUE pairs from a .env file in the
    # backend folder or the project root. Real environment variables win.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trilane}
    username: ${DB_USERNAME:trilane}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  # Public address of the website; used for links in emails and as the
  # default allowed origin for browser requests.
  site-url: ${SITE_URL:http://localhost:5173}
  # Comma-separated list of origins allowed to call the API from a browser.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${SITE_URL:http://localhost:5173}}
  # Time zone used for "this week", "this month" and overdue follow-ups.
  timezone: ${APP_TIMEZONE:Asia/Manila}
  jwt:
    # At least 32 characters. Required in production; generated per run in dev.
    secret: ${JWT_SECRET:}
    issuer: trilane-api
    access-token-minutes: 15
    refresh-token-days: 7
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: Lax
    max-failed-attempts: 5
    lockout-minutes: 15
    invite-valid-hours: 72
    reset-valid-minutes: 60
  mail:
    from: ${MAIL_FROM:Trilane Tech <no-reply@localhost>}
    # Comma-separated. Receives a message for every new lead.
    lead-notification-to: ${LEAD_NOTIFICATION_TO:}
  admin:
    # Used once, on first start, when no accounts exist yet.
    email: ${ADMIN_EMAIL:}
    name: ${ADMIN_NAME:}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
    max-bytes: 5242880
  rate-limit:
    lead-submissions: 5
    window-minutes: 60

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
