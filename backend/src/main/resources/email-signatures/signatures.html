<style>
/* VOICE: a practical team tool, calm and exact.
   IDEA: a stack of Gmail compose windows, one per signature.
   PICTURE: the three signatures themselves, on white "email" panels.
   COLOUR and TYPE: Trilane teal on white / deep ink at night; Inter, as on the site.
   LAYOUT: person switch, then three compose cards. */
:root{color-scheme:light dark;--bg:light-dark(#f4f7f6,#0e1113);--panel:light-dark(#ffffff,#161b1d);--ink:light-dark(#0e1113,#eef2f1);--muted:light-dark(#4b5563,#a9b6b3);--line:light-dark(#dde4e2,#2a3234);--teal:light-dark(#0f766e,#5eead4);--teal-ink:light-dark(#ffffff,#0e1113);--soft:light-dark(#e6f4f1,#13312d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(24px,4vw,48px) max(4vw,16px)}
h1{font-size:clamp(28px,4vw,40px);line-height:1.08;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:0 0 14px}
.lead{color:var(--muted);max-width:62ch;margin:0}
.who{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 20px}
.who button{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.who button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px}
.head h3{margin:0;font-size:17px}
.head p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:56ch}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border-radius:10px;cursor:pointer;border:1px solid var(--teal);background:var(--teal);color:var(--teal-ink)}
.acts button.alt{background:transparent;color:var(--teal)}
.mail{background:#fff;color:#0e1113;border-top:1px solid var(--line);padding:18px clamp(16px,3vw,28px) 24px}
.bar{font:13px/1 Inter,sans-serif;color:#6b7280;border-bottom:1px solid #e5e7eb;padding:4px 0 10px;margin-bottom:6px;display:flex;gap:6px}
.bar+.bar{margin-bottom:16px}
.body{font:14px/1.6 Arial,Helvetica,sans-serif;color:#1f2937;margin-bottom:14px}
.sig{overflow-x:auto}
.status{font-size:13px;color:var(--teal);min-height:20px;padding:0 18px 12px;margin:0}
@media(max-width:600px){.head{flex-direction:column}.acts,.acts button{width:100%}}
</style>
</head>

</main>

  const plain = html => { const d = document.createElement('div'); d.innerHTML = html.replace(/<\/tr>/g,'</tr>\n'); return d.textContent.replace(/ /g,' ').trim(); };

  async function copyRich(html, statusEl){
    let ok = false;
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([html], {type:'text/html'}),
          'text/plain': new Blob([plain(html)], {type:'text/plain'})
        })]);
        ok = true;
      } catch (e) {}
    }
    if (!ok) {
      try {
        const box = document.createElement('div');
        box.innerHTML = html;
        box.style.cssText = 'all:initial;position:fixed;left:-9999px;top:0;background:#fff';
        document.body.append(box);
        const r = document.createRange(); r.selectNodeContents(box);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        ok = document.execCommand('copy');
        s.removeAllRanges(); box.remove();
      } catch (e) {}
    }
    statusEl.textContent = ok ? 'Copied. Paste it into Gmail’s signature box.' :
      'Your browser blocked copying. Try again, or use Copy HTML.';
  }
  async function copyCode(html, statusEl){
    try { await navigator.clipboard.writeText(html); statusEl.textContent = 'HTML code copied.'; }
    catch (e) { statusEl.textContent = 'Your browser blocked copying. Try again.'; }
  }

  function show(key){
    for (const b of who.children) b.setAttribute('aria-pressed', b.dataset.k === key);
    const p = D.people.find(x => x.key === key);
    cards.innerHTML = D.versions.map(v => `
