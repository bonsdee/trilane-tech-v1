<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>New lead</title></head>
<body style="margin:0;padding:0;background:#F5F6F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111417;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F6F7;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E3E6E9;border-radius:20px;">
<tr><td style="padding:32px 32px 8px 32px;font-size:15px;font-weight:700;letter-spacing:-0.01em;">
<span style="color:#0F766E;">&#9776;</span>&nbsp; Trilane Tech</td></tr>
<tr><td style="padding:8px 32px 32px 32px;font-size:16px;line-height:1.6;">
<h1 style="font-size:24px;line-height:1.2;margin:0 0 16px 0;letter-spacing:-0.02em;">New lead: {{name}}</h1>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;font-size:15px;">
<tr><td style="padding:6px 0;color:#5B6570;width:140px;vertical-align:top;">Email</td><td style="padding:6px 0;">{{email}}</td></tr>
<tr><td style="padding:6px 0;color:#5B6570;vertical-align:top;">Phone</td><td style="padding:6px 0;">{{phone}}</td></tr>
<tr><td style="padding:6px 0;color:#5B6570;vertical-align:top;">Company</td><td style="padding:6px 0;">{{company}}</td></tr>
<tr><td style="padding:6px 0;color:#5B6570;vertical-align:top;">Website</td><td style="padding:6px 0;">{{website}}</td></tr>
<tr><td style="padding:6px 0;color:#5B6570;vertical-align:top;">Interested in</td><td style="padding:6px 0;">{{service}}</td></tr>
<tr><td style="padding:6px 0;color:#5B6570;vertical-align:top;">Came from</td><td style="padding:6px 0;">{{source}}</td></tr>
</table>
<p style="margin:20px 0 6px 0;color:#5B6570;font-size:14px;">Message</p>
<div style="background:#F5F6F7;border-radius:12px;padding:16px;font-size:15px;">{{message}}</div>
<p style="margin:28px 0;"><a href="{{dashboardLink}}" style="display:inline-block;background:#0F766E;color:#FFFFFF;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:999px;">Open in dashboard</a></p>
<p style="margin:0;color:#5B6570;font-size:14px;">Reply to this email to answer {{name}} directly.</p>
</td></tr>
</table>
<p style="font-size:12px;color:#5B6570;margin:16px 0 0 0;">Trilane Tech &middot; trilanetech.com</p>
</td></tr>
</table>
</body>
</html>
