<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Trilane Tech | Websites that bring in leads</title>
    <meta name="description" content="Trilane Tech builds websites and landing pages for small businesses, startups and service businesses, and helps handle the leads they bring in." />
    <!-- Sharing previews. Most link previewers do not run JavaScript, so these defaults live here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trilane Tech" />
    <meta property="og:title" content="Trilane Tech | Websites that bring in leads" />
    <meta property="og:description" content="Websites, landing pages and lead handling for small businesses, startups and service businesses." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trilane Tech: websites that bring in leads, and the hands to follow them up." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        var t = localStorage.getItem('trilane-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Trilane Tech needs JavaScript to show this site. Please enable it and reload.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
